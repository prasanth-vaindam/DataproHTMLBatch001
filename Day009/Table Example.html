<!DOCTYPE html>
<html>
<head>
<style>
table {
    width: 70%;
    border-collapse: collapse;
}

table, th, td {
    border: 1px solid black;
}

th {
    background-color: lightgray;
}
</style>
</head>
<body>

<table>

    <colgroup>
        <col span="2" style="background-color:#D6EEEE">
    </colgroup>

    <tr>
        <th colspan="3">Student Details</th>
    </tr>

    <tr>
        <th>Name</th>
        <th>Age</th>
        <th>City</th>
    </tr>

    <tr>
        <td rowspan="2">John</td>
        <td>20</td>
        <td>Delhi</td>
    </tr>

    <tr>
        <td>21</td>
        <td>Mumbai</td>
    </tr>

</table>

</body>
</html>
