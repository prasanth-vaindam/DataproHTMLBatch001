<style>
    p { color: blue; }      /* Element Selector */

.note { color: red; }   /* Class Selector */

#header { color: green; } /* ID Selector */

* { font-family: Arial; } /* Universal Selector */
</style>
<body>

    <h1 id="header">Welcome</h1>

    <p class="note">This is a note.</p>

    <p>This is a regular paragraph.</p>
</body>

<!-- Rule: Use class when multiple elements need the same style. 
 Use id when only one element needs a unique style. -->
