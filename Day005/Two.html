<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class and ID Selectors</title>
    <style>
        .blue-text {
            color: blue;
        }
        .red-text {
            color: red;
        }
        .green-button {
            background-color: green;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 0px;
        }
        #unique-button {
            background-color: orange;
            color: white;
        }
    </style>
</head>
<body>
    <p class="blue-text">This is a paragraph with class "blue-text".</p>
    <button class="green-button">Click Me</button>
    <p class="red-text">This is a paragraph with class "red-text".</p>
    <button class="green-button">Click Me</button>
    <p class="blue-text">This is another paragraph with class "blue-text".</p>
    <button class="green-button">Click Me</button>
    <p class="red-text">This is a paragraph with class "red-text".</p> 
    <button class="green-button">Click Me</button>
    <p class="blue-text">This is another paragraph with class "blue-text".</p>
    <button class="green-button">Click Me</button>
    <p class="red-text">This is a paragraph with class "red-text".</p> 
    <button class="green-button">Click Me</button>
    <br>
    <br>
    <hr>
    <button id="unique-button">Go</button>

    <!-- <p id="unique-paragraph">This is a paragraph with id "unique-paragraph".</p> -->
</body>
</html>
