<!DOCTYPE html>
<html>
<head>
    <title>School Information</title>

    <style>

        /* Universal Selector */
        * {
            font-family: Arial;
        }

        /* ID Selector */
        #schoolTitle {
            color: blue;
            text-align: center;
        }

        /* Class Selector */
        .info {
            color: green;
            font-size: 18px;
        }

        /* Class Selector */
        .notice {
            color: red;
            background-color: yellow;
        }

        /* Element Selector */
        h2 {
            color: purple;
        }

        /* Challenge Task - ID Selector */
        #sports {
            color: white;
            background-color: green;
            text-align: center;
        }

        /* Challenge Task - Class Selector */
        .event {
            color: blue;
            font-size: 20px;
        }

    </style>
</head>
<body>

    <h1 id="schoolTitle">My School</h1>

    <p class="info">
        My school has a large playground.
    </p>

    <p class="info">
        Our teachers are very helpful.
    </p>

    <p class="notice">
        Annual Exams Start Next Month
    </p>

    <h2>School Activities</h2>

    <h1 id="sports">Sports Day</h1>

    <p class="event">
        Sports Day will be held on 15th August.
    </p>

</body>
</html>
