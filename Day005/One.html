<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styles</title>
    <style>
        /* This is an internal CSS style block, */
 
        h1,h2,h3 {
            color: red;
            font-size: 50px;
        }

        p {
            color: blue;
            font-size: 20px;
        }

        button {
            background-color: green;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 0px;
        }

    </style>
</head>
<body>
    <h1 >This is a heading</h1>
    <h2>This is a heading TWO</h2>
    <h3>This is a heading THREE</h3>
    <p >This is a paragraph.</p>

    <button>Click Me</button>
    <button>Go</button>

</body>
</html>
