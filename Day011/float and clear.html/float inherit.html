<!DOCTYPE html>
<html>
<head>
<style>
.parent {
    float: right;
    width: 250px;
    border: 2px solid black;
}

.child {
    float: inherit;
    width: 100px;
    height: 100px;
    background-color: orange;
}
</style>
</head>
<body>

<div class="parent">
    Parent Div
    <div class="child">Child Div</div>
</div>

<p>This paragraph comes after the parent div.</p>

</body>
</html>
