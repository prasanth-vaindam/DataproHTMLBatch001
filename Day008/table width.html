<!DOCTYPE html>
<html>
<head>
<style>
table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    border: 1px solid black;
}

th {
    width: 30%;
}

th:last-child {
    width: 40%;
}
</style>
</head>
<body>

<h2>Define a Table</h2>

<table>
    <tr>
        <th>Name</th>
        <th>Age</th>
        <th>Subject</th>
    </tr>
    <tr>
        <td>Prasanth</td>
        <td>25</td>
        <td>Java</td>
    </tr>
    <tr>
        <td>Ravi</td>
        <td>22</td>
        <td>Python</td>
    </tr>
    <tr>
        <td>Sita</td>
        <td>24</td>
        <td>HTML</td>
    </tr>
</table>

</body>
</html>
