<!DOCTYPE html>
<html>
<head>
    <title>Lists Example</title>
</head>
<body>

<h1>My Favorite Subjects</h1>

<h3>Ordered List</h3>
<ol>
    <li>Mathematics</li>
    <li>Science</li>
    <li>English</li>
    <li>Computer Science</li>
</ol>

<h3>Unordered List</h3>
<ul>
    <li>Cricket</li>
    <li>Reading</li>
    <li>Music</li>
    <li>Drawing</li>
</ul>

</body>
</html>
