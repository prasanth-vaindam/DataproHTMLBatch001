<!DOCTYPE html>
<html>
<head>
    <title>Employee Registration</title>

    <style>
        body{
            font-family:Arial;
        }

        form{
            width:370px;
            margin:auto;
            border:1px solid gray;
            padding:20px;
        }

        input{
            width:100%;
            padding:4px;
            margin-bottom:10px;
        }

        button{
            width:100%;
            padding:10px;
        }
    </style>

</head>
<body>

<h1 align="center">Employee Registration</h1>

<form>

<label>Employee Name</label>
<input type="text">

<label>Email</label>
<input type="email">

<label>Password</label>
<input type="password">

<label>Salary</label>
<input type="number">

<button>Register</button>

</form>

</body>
</html>
