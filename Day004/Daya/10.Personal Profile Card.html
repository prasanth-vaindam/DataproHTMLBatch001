<!DOCTYPE html>
<html>
<head>
    <title>Profile Card</title>

    <style>

        .card{

            width:300px;
            margin:auto;
            border:2px solid gray;
            padding:20px;
            text-align:center;
            border-radius:10px;
            box-shadow:5px 5px 10px gray;
            background-color:lightyellow;

        }

        img{

            width:150px;
            border-radius:50%;

        }

    </style>

</head>
<body>

<div class="card">

<img src="profile.png" alt="Profile Picture">

<h2>Rahul Kumar</h2>

<p>Course : B.Tech</p>

<p>Email : rahul@gmail.com</p>

<p>Phone : 9876543210</p>

<p>Hobbies : Cricket, Reading, Coding</p>

</div>

</body>
</html>
