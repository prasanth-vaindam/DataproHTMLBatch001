<!DOCTYPE html>
<html>
<head>
    <title>College Admission</title>

    <style>
        body{
            font-family:Arial;
        }

        form{
            width:400px;
            margin:auto;
            border:1px solid black;
            padding:20px;
        }

        input,select,textarea{
            width:100%;
            padding:8px;
            margin-bottom:10px;
        }

        button{
            width:100%;
            padding:10px;
        }

    </style>

</head>
<body>

<h1 align="center">College Admission Form</h1>

<form>

<label>Student Name</label>
<input type="text">

<label>Date of Birth</label>
<input type="date">

<label>Course</label>

<select>
    <option>B.Tech</option>
    <option>B.Sc</option>
    <option>B.Com</option>
    <option>MCA</option>
</select>

<label>Address</label>

<textarea rows="4"></textarea>

<label>Upload Photo</label>
<input type="file">

<button>Submit</button>

</form>

</body>
</html>
